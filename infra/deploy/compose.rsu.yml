# Production stack for one AWS RSU instance, deployed by infra/deploy/deploy.sh.
# The separate local Compose lives at services/rsu/compose.yml.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports: ["1883:1883"]
    volumes:
      - /opt/v2x/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
  rsu:
    image: ${RSU_IMAGE:?RSU_IMAGE is required}
    depends_on: [mosquitto]
    ports: ["8090:8090"]
    environment:
      RSU_ID: ${RSU_ID:?RSU_ID is required}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-v2x-events}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:?SNS_TOPIC_ARN required}
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_APP_USER: rsu
      MQTT_APP_PASSWORD: ${MQTT_APP_PASSWORD:?MQTT_APP_PASSWORD required}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATA_DIR: /data
      WINDOW_S: ${WINDOW_S:-5}
      WINDOW_LATENESS_S: ${WINDOW_LATENESS_S:-2}
    volumes:
      - rsu-data:/data
    restart: unless-stopped
volumes:
  mosquitto-data: {}
  rsu-data: {}
